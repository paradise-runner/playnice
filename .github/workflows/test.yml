name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # npm 11 refuses install scripts unless they are covered by allowScripts;
      # node-pty's helper only needs its executable bit when that happens.
      - name: Ensure node-pty helper is executable
        run: chmod +x node_modules/node-pty/prebuilds/*/spawn-helper 2>/dev/null || true
      - run: npm test
